# PHOENIX automated test matrix manifest (PHX-090, ADR-078).
# Run: python scripts/test_matrix.py   (see docs/24_TEST_EVALUATION.md)
# Every tests/test_*.py and tests/*.test.mjs file must be listed under [[file]];
# every docs/24 category must be covered by a file or declared as a [[gap]].
schema_version = 1

# ---- Required gates, in execution order. "{out}" is the results directory.

[[gate]]
id = "uv-sync"
command = ["uv", "sync", "--locked"]
timeout = 1200

[[gate]]
id = "ruff-check"
command = ["uv", "run", "--locked", "--no-sync", "ruff", "check", "."]
timeout = 600

[[gate]]
id = "ruff-format"
command = ["uv", "run", "--locked", "--no-sync", "ruff", "format", "--check", "."]
timeout = 600

[[gate]]
id = "mypy"
command = ["uv", "run", "--locked", "--no-sync", "mypy"]
timeout = 1200

[[gate]]
# pyproject.toml is guard-pinned, so scripts/ get their own strict mypy gate.
id = "mypy-scripts"
command = ["uv", "run", "--locked", "--no-sync", "mypy", "--strict", "scripts/test_matrix.py", "scripts/fyp_benchmark.py", "scripts/phoenix_mission_smoke.py", "scripts/routing_benchmark.py", "scripts/fyp_multi_agent.py", "scripts/metric_datasets.py", "scripts/metric_benchmark.py"]
timeout = 600

[[gate]]
id = "pytest"
command = ["uv", "run", "--locked", "--no-sync", "pytest", "-q", "--junitxml={out}/pytest.xml"]
results = "junit:{out}/pytest.xml"
timeout = 3600

[[gate]]
id = "npm-test"
command = ["npm", "test"]
results = "node-spec"
timeout = 1200

[[gate]]
id = "typecheck"
command = ["npm", "run", "typecheck", "--workspace", "@phoenix/desktop"]
timeout = 600

[[gate]]
id = "frontend-build"
command = ["npm", "run", "build", "--workspace", "@phoenix/desktop", "--", "--outDir", "{out}/frontend-dist", "--emptyOutDir"]
timeout = 900

[[gate]]
id = "tauri-info"
command = ["npm", "run", "tauri:info", "--workspace", "@phoenix/desktop"]
timeout = 600

[[gate]]
id = "cargo-check"
command = ["cargo", "check", "--locked", "--manifest-path", "apps/desktop/src-tauri/Cargo.toml"]
timeout = 2400

[[gate]]
id = "cargo-test"
command = ["cargo", "test", "--locked", "--manifest-path", "apps/desktop/src-tauri/Cargo.toml"]
timeout = 2400

[[gate]]
id = "uv-build"
command = ["uv", "build", "--out-dir", "{out}/dist"]
timeout = 900

# ---- Manual acceptance layer (reported as MANUAL; never an automated PASS).

[[manual]]
id = "native-webview2-acceptance"
description = "Native WebView2 desktop acceptance of the accepted release executable (keyboard/focus, layout, reduced motion, runtime errors, observability presentation)."
evidence = "ADR-077; external evidence validation/PHX-phase8-B5-rebuild-20261014-192904 (EXECUTION_REPORT.md, COMPLETE_CHECKLIST.r5.md)"

[[manual]]
id = "live-models-and-devices"
description = "Live local-model inference (Ollama/Colibri on BLAZE-6) and real audio/desktop devices; the automated suite uses fakes and fixtures."
evidence = "Not yet performed as acceptance; scheduled under PHX-091 (benchmarks) and PHX-093 (demo scenarios)."

