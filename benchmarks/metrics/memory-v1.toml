# ---- two documents mention the trip in May; either can answer

[[case]]
id = "may-trip-month"
category = "multi_source"
question = "In which month are the Portugal trips?"
sources = ["trip-lisbon", "trip-porto"]
answer = "May"

[[case]]
id = "recipe-flour-any"
category = "multi_source"
question = "Which of my recipes use flour?"
sources = ["recipe-pancakes", "recipe-flatbread"]
answer = "flour"

# ---- scorer calibration vectors (fixed expected scores)

[[calibration]]
case = "tomato-watering"
retrieved = ["garden-tomatoes", "garden-herbs", "bike-maintenance"]
answer = "They are watered every second morning."
hit_at_1 = true
hit_at_k = true
reciprocal_rank = 1.0
answer_correct = true

[[calibration]]
case = "flatbread-rest"
retrieved = ["recipe-pancakes", "recipe-flatbread", "garden-herbs"]
