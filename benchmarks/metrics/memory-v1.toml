# PHOENIX memory retrieval QA set (PHX-117 for PHX-110, ADR-115/ADR-117).
# FIXED: any change requires a version bump and a new file; tests pin this
# file's sha256.
#
# `document` entries are a small fictional fixture corpus (no private data) to
# ingest into an empty memory store. Each case asks one question; `sources`
# are the document IDs that contain the answer and `answer` is a short string
# every source contains (case-insensitive). Distractor documents share topics
# and wording with the sources on purpose.
#
# Scoring (deterministic, k = 3): hit@1 and hit@3 (a source among the first 1
# or 3 retrieved document IDs), reciprocal rank of the first source, and, when
# the flow also answers, answer_correct (the answer contains `answer`,
# case-insensitive). `calibration` entries are fixed scorer test vectors.
suite_id = "phoenix-memory"
version = "1.0.0"
k = 3

[[document]]
id = "garden-tomatoes"
title = "Garden notes: tomatoes"
text = "The cherry tomatoes in the north bed are watered every second morning. They were planted on 4 April and the first fruit appeared in early June. The stakes are bamboo."

[[document]]
id = "garden-herbs"
title = "Garden notes: herbs"
text = "Basil grows in the window box and is watered daily. Mint is kept in a separate pot because it spreads. The rosemary bush by the gate is pruned in September."

[[document]]
id = "bike-maintenance"
title = "Bike maintenance log"
text = "The road bike chain was replaced in February after 3000 kilometres. Tyre pressure is set to 80 psi. The next brake pad check is due in October."

[[document]]
id = "book-club"
title = "Book club schedule"
text = "The book club meets on the first Thursday of each month at the community library. This month's book is The Silent River. Members bring one snack each."

[[document]]
id = "recipe-pancakes"
title = "Recipe: pancakes"
text = "Mix 200 grams of flour, two eggs and 300 millilitres of milk. Rest the batter for 20 minutes. Cook each pancake for about one minute per side."

[[document]]
id = "recipe-flatbread"
title = "Recipe: flatbread"
text = "Combine 250 grams of flour with warm water and a pinch of salt. Knead for 5 minutes and rest the dough for 30 minutes. Cook in a dry pan."

[[document]]
id = "trip-lisbon"
title = "Trip plan: Lisbon"
text = "The Lisbon trip runs from 14 to 18 May. The hotel is near Rossio square. The tram 28 tour is booked for the second day."

[[document]]
id = "trip-porto"
title = "Trip plan: Porto"
text = "The Porto day trip is on 16 May by train from Santa Apolonia station. The river cruise leaves at 3 pm. Return train at 8 pm."

[[document]]
id = "wifi-setup"
title = "Home network notes"
text = "The guest network is called Orchard-Guest. The router was restarted on 2 October. Smart plugs use the 2.4 GHz band."

[[document]]
id = "language-study"
title = "Language study plan"
text = "Spanish practice is 15 minutes each evening using flash cards. The weekly conversation class is on Tuesday. The goal is level B1 by December."

# ---- single fact, direct wording

[[case]]
id = "tomato-watering"
category = "direct"
question = "How often are the cherry tomatoes watered?"
sources = ["garden-tomatoes"]
answer = "every second morning"

[[case]]
id = "chain-replaced"
category = "direct"
question = "When was the road bike chain replaced?"
sources = ["bike-maintenance"]
answer = "February"

[[case]]
id = "book-this-month"
category = "direct"
question = "Which book is the book club reading this month?"
sources = ["book-club"]
answer = "The Silent River"

[[case]]
id = "lisbon-dates"
category = "direct"
question = "What are the dates of the Lisbon trip?"
sources = ["trip-lisbon"]
answer = "14 to 18 May"

[[case]]
id = "guest-network"
category = "direct"
question = "What is the guest network called?"
sources = ["wifi-setup"]
answer = "Orchard-Guest"

[[case]]
id = "spanish-goal"
category = "direct"
question = "What level is the Spanish study goal?"
sources = ["language-study"]
answer = "B1"

# ---- paraphrased questions: little word overlap with the source

