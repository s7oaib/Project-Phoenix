rationale = "Needs a workspace file read before answering."

[[case]]
id = "workspace-projects-listing"
category = "workspace_files"
label = "complex"
request = "Show me which files are inside the projects directory."
rationale = "Needs a directory listing tool call."

[[case]]
id = "workspace-count-ideas"
category = "workspace_files"
label = "complex"
request = "Check notes/ideas.txt and tell me how many ideas it lists."
rationale = "Needs a workspace file read, then counting."

[[case]]
id = "workspace-empty-check"
category = "workspace_files"
label = "complex"
request = "Is draft.txt in my workspace empty?"
