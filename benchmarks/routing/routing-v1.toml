# PHOENIX request-triage routing set (PHX-105, ADR-090). FIXED: any change to a
# case (request, label, category or rationale) requires a version bump and a
# new file; tests pin this file's sha256 together with its version.
# label is the path PHOENIX should take: "direct" (answer in one reply) or
# "complex" (needs planning, tools or workspace files, or several steps).
# Requests are harmless and hold no private data; file names are generic.
# The owner reviews every label in the PHX-105 PR.
suite_id = "phoenix-routing"
version = "1.0.0"

# ---- factual: questions answered directly from general knowledge

[[case]]
id = "factual-boiling-point"
category = "factual"
label = "direct"
request = "What is the boiling point of water at sea level in Celsius?"
rationale = "A single well-known fact needs no plan, tool or file."

[[case]]
id = "factual-author"
category = "factual"
label = "direct"
request = "Who wrote the play Romeo and Juliet?"
rationale = "One-fact recall answered in one reply."

[[case]]
id = "factual-acronym"
category = "factual"
label = "direct"
request = "What does the acronym CPU stand for?"
rationale = "Expanding a common acronym is a direct answer."

[[case]]
id = "factual-leap-year"
category = "factual"
label = "direct"
request = "How many days are in a leap year?"
rationale = "A single fact with no steps."

[[case]]
id = "factual-capital"
category = "factual"
label = "direct"
request = "What is the capital of Japan?"
rationale = "One-fact recall."

[[case]]
id = "factual-photosynthesis"
category = "factual"
label = "direct"
request = "Explain in one sentence what photosynthesis is."
rationale = "A short explanation fits in one reply."

[[case]]
id = "factual-multiplication"
category = "factual"
label = "direct"
request = "What is 15 multiplied by 4?"
rationale = "One-step arithmetic needs no plan."

[[case]]
id = "factual-definition"
category = "factual"
label = "direct"
request = "Define the word 'ephemeral'."
rationale = "A dictionary-style definition is a direct answer."

[[case]]
id = "factual-chemical-symbol"
category = "factual"
label = "direct"
request = "What is the chemical symbol for gold?"
rationale = "One-fact recall."

[[case]]
id = "factual-api"
category = "factual"
label = "direct"
request = "Briefly explain what an API is."
rationale = "A brief explanation fits in one reply."

# ---- rewrite_format: transforming text given in the request

[[case]]
id = "rewrite-formal"
category = "rewrite_format"
label = "direct"
request = "Rewrite this sentence to sound more formal: hey, can u send me the report asap?"
rationale = "Rewriting text supplied in the request is a single transformation."

[[case]]
id = "rewrite-uppercase"
category = "rewrite_format"
label = "direct"
request = "Convert to uppercase: rise from the ashes"
rationale = "A mechanical transformation of given text."

[[case]]
id = "rewrite-grammar"
category = "rewrite_format"
label = "direct"
request = "Fix the grammar in this sentence: She don't like apples."
rationale = "Correcting one supplied sentence needs no plan."

[[case]]
id = "rewrite-bullets"
category = "rewrite_format"
label = "direct"
request = "Turn these items into a bulleted list: apples, pears, plums"
rationale = "Reformatting supplied items is direct."

[[case]]
id = "rewrite-translate"
category = "rewrite_format"
label = "direct"
request = "Translate 'good morning' into French."
rationale = "A short translation is a single reply."

[[case]]
id = "rewrite-summary-sentence"
category = "rewrite_format"
label = "direct"
request = "Summarize in one sentence: The meeting was moved from Monday to Wednesday because the room was already booked."
rationale = "Summarizing text supplied in the request needs no file or tool."

[[case]]
id = "rewrite-json"
category = "rewrite_format"
label = "direct"
request = "Format this as a JSON object with the keys name and age: Ana, 31"
rationale = "Formatting supplied values is a single transformation."

[[case]]
id = "rewrite-title-case"
category = "rewrite_format"
label = "direct"
request = "Put this in title case: the quiet harbour at dawn"
rationale = "A mechanical transformation of given text."

[[case]]
id = "rewrite-shorten"
category = "rewrite_format"
label = "direct"
request = "Shorten this to under ten words: We would like to let you know that the office will be closed on Friday."
rationale = "Condensing one supplied sentence is direct."

[[case]]
id = "rewrite-exact-token"
category = "rewrite_format"
label = "direct"
request = "Reply with exactly the word READY."
rationale = "An exact-format reply needs nothing but the reply."

# ---- workspace_files: one read, listing or metadata check in the workspace

[[case]]
id = "workspace-read-notes"
category = "workspace_files"
label = "complex"
request = "Read notes.txt in my workspace and tell me what it says."
rationale = "Needs a read-only workspace file read through a document step."

[[case]]
id = "workspace-list-root"
category = "workspace_files"
label = "complex"
request = "List the files in my workspace folder."
rationale = "Needs a directory listing tool call."

[[case]]
id = "workspace-file-size"
category = "workspace_files"
label = "complex"
request = "How big is report.pdf in my workspace?"
rationale = "Needs a file metadata (stat) tool call."

[[case]]
id = "workspace-docs-folder"
category = "workspace_files"
label = "complex"
request = "What is in the docs folder of my workspace?"
rationale = "Needs a directory listing tool call."

[[case]]
id = "workspace-todo-first"
category = "workspace_files"
label = "complex"
request = "Open todo.md and tell me the first item on it."
rationale = "Needs a workspace file read."

[[case]]
id = "workspace-modified-time"
category = "workspace_files"
label = "complex"
request = "When was budget.csv in my workspace last modified?"
