# PHX-092 (ADR-129): build the unsigned per-user NSIS installer on Windows and upload it.
# It never publishes a release; the artifact is for review and manual distribution.
name: release-installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-installer.yml"
      - "packaging/**"
      - "scripts/build_installer.py"
      - "apps/desktop/**"
      - "phoenix/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build installer
        run: uv run --locked python scripts/build_installer.py

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phoenix-installer-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            build/phoenix-runtime/runtime-manifest.json
          if-no-files-found: error
          retention-days: 30
