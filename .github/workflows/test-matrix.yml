# PHX-090 (ADR-078): run the automated test matrix for every PR to main and every push to main.
name: test-matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Guards compare against origin/main and historical baseline commits.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.10"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run test matrix
        run: python scripts/test_matrix.py

      - name: Upload matrix results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-matrix-results
          path: .test-matrix/
          # .test-matrix/ is a dot-directory; upload-artifact skips hidden paths by default.
          include-hidden-files: true
          if-no-files-found: warn
