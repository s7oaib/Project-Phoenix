# PHX-090 (ADR-078): run the automated test matrix for every PR to main and every push to main.
name: test-matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Guards compare against origin/main and historical baseline commits.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Run test matrix
        run: python scripts/test_matrix.py

      - name: Upload matrix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix-results
          path: .test-matrix/
          if-no-files-found: warn
