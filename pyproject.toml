[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "phoenix"
version = "0.1.0"
description = "PHOENIX local-first desktop assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0.115,<1",
    "faster-whisper>=1.2.1,<2",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "piper-tts>=1.8,<2",
    "playwright>=1,<2",
    "psutil>=7,<8",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pypdf>=6.19,<7",
    "python-docx>=1.2,<2",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "reportlab>=5.0.1,<6",
    "sounddevice>=0.5.6,<0.6",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
    "websockets>=17.2,<18",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.3",
    "types-psutil>=7.2.2.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["phoenix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["phoenix", "tests"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.uv]
# PHX-114 (ADR-105): huggingface-hub 1.x/2.x pull in typer or httpx2 (httpx2
# replaces Starlette's TestClient transport); faster-whisper only imports it.
constraint-dependencies = ["huggingface-hub<1"]
