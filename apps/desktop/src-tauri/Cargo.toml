[package]
name = "phoenix-desktop"
version = "0.1.0"
description = "PHOENIX desktop foundation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# PHX-106 (ADR-091): backend sidecar, per-launch token and loopback HTTP/WebSocket proxy.
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
